[project]
name = "derby"
version = "1.0.0"
description = "Derby cafe POS (cashier) desktop app"
requires-python = ">=3.8"

[tool.ruff]
target-version = "py38"
line-length = 110
exclude = ["derby/features/*/README.md", ".claude", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
